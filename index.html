<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickleball Party Tournament</title>
<meta name="theme-color" content="#1f5130">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23e3dd3f' stroke='%231f5130' stroke-width='6'/%3E%3Ccircle cx='35' cy='35' r='6' fill='%231f5130'/%3E%3Ccircle cx='63' cy='31' r='6' fill='%231f5130'/%3E%3Ccircle cx='68' cy='60' r='6' fill='%231f5130'/%3E%3Ccircle cx='39' cy='66' r='6' fill='%231f5130'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ea; --surface:#ffffff; --surface-2:#eef0e4; --ink:#16241a; --muted:#5b6a5e; --line:#dcdfd2;
  --brand:#1f5130; --brand-ink:#ffffff; --accent:#dcd53b; --accent-ink:#1d2410;
  --good:#2f7d46; --warn:#a85a15; --danger:#b3261e;
  --gold:#c9a227; --silver:#8b97a4; --bronze:#a5683a;
  --radius:14px; --shadow:0 1px 2px rgba(20,40,25,.06),0 6px 18px rgba(20,40,25,.06);
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1511;--surface:#172019;--surface-2:#1e2a21;--ink:#e7eee5;--muted:#9db0a0;--line:#2b392f;
  --brand:#83c645;--brand-ink:#0d150f;--accent:#e3dd3f;--shadow:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;margin:0}
h2{font-size:20px;margin-bottom:12px}
h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.muted{color:var(--muted)}
small{color:var(--muted)}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink)}
.top{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto;padding:12px 16px 8px}
.ball{width:34px;height:34px;flex:none}
.top h1{font-size:20px;font-weight:800;line-height:1.1}
.top .sub{font-size:12.5px;opacity:.85}
.titlewrap{flex:1;min-width:0}
.acct{display:flex;align-items:center;gap:8px;flex:none}
.acct .who{font-size:12.5px;text-align:right;line-height:1.2;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px;margin-top:2px}
.hbtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
@media (prefers-color-scheme:dark){.hbtn{border-color:rgba(0,0,0,.3)}}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1100px;margin:0 auto;padding:4px 16px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.12);color:inherit;font-weight:600;font-size:13.5px;cursor:pointer}
@media (prefers-color-scheme:dark){nav button{background:rgba(0,0,0,.14)}}
nav button.on{background:var(--accent);color:var(--accent-ink)}
nav .sep{flex:none;width:1px;background:rgba(255,255,255,.3);margin:4px 2px}

main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:14px}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:16px;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
textarea{width:100%;min-height:110px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}

.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.icon{padding:5px 9px}
.btn.big{font-size:17px;padding:12px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #747775;border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer}
.gbtn svg{width:18px;height:18px}

.banner{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.ok{background:color-mix(in srgb,var(--good) 14%,transparent);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

/* register */
.hero{background:var(--brand);color:var(--brand-ink);border:0}
.hero h2{font-size:26px;margin-bottom:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.facts div{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px}
@media (prefers-color-scheme:dark){.facts div{background:rgba(0,0,0,.12)}}
.facts b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.8;font-weight:600}
.hero p{margin:12px 0 0;opacity:.92}
.form{display:grid;gap:12px;max-width:520px}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.steps .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;border:2px solid var(--line);color:var(--muted)}
.steps li.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.steps .txt{flex:1;min-width:0}
.steps .txt small{display:block}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.place{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;background:var(--surface-2)}
.place.p1{background:var(--gold);color:#241c00}
.place.p2{background:var(--silver);color:#11161b}
tr.mine td{background:color-mix(in srgb,var(--accent) 22%,transparent)}

/* players */
.plist{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center}
.prow .static{padding:9px 11px;font-weight:600}
@media (max-width:520px){.prow{grid-template-columns:1fr 80px auto}}
.chip{font-size:11px;font-weight:600;color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);border-radius:999px;padding:1px 8px;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

/* pools & teams */
.pool{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.pool h3{padding:10px 14px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center}
.team{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.team.mine{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.team .tn{font-weight:600}
.team input{padding:6px 9px;font-weight:600}
.team select{padding:5px 8px}

/* team swapping */
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pchip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px;cursor:pointer;touch-action:manipulation}
.pchip.empty{border-style:dashed;color:var(--muted);background:transparent}
.pchip.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.pchip.target{border-color:var(--brand);border-style:dashed}
.warnline{display:block;margin-top:4px;color:var(--warn);font-weight:600}
.swapcard{padding:12px 16px;font-size:14px}
.swapcard.active{position:sticky;top:8px;z-index:15;background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* matches */
.round{margin-bottom:18px}
.round h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pill{font-family:var(--body);font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.you{background:var(--accent);color:var(--accent-ink)}
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.match.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.match.tie{border-color:var(--warn)}
.match.mine{border:2px solid var(--accent)}
.mhead{font-size:12px;font-weight:600;color:var(--muted);padding:6px 12px;background:var(--surface-2);display:flex;justify-content:space-between;gap:6px}
.mrow{display:grid;grid-template-columns:1fr 62px;gap:8px;align-items:center;padding:8px 12px}
.mrow + .mrow{border-top:1px solid var(--line)}
.mrow.mine{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.mrow .tn{font-weight:600;min-width:0;overflow-wrap:anywhere}
.mrow .tn small{display:block;font-weight:400}
.mrow.win .tn::after{content:" ✓";color:var(--good)}
.score{width:62px;text-align:center;font-weight:700;font-size:17px;padding:7px 4px}
.sc{width:62px;text-align:center;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.tiemsg{font-size:12.5px;color:var(--warn);padding:0 12px 8px}

/* bracket */
.bracket{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
.bcol{display:flex;flex-direction:column;gap:14px}
.bcol .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
@media (max-width:620px){.bracket{grid-template-columns:1fr}}
.div-gold{border-top:5px solid var(--gold)}
.div-silver{border-top:5px solid var(--silver)}
.podium{display:grid;gap:8px;margin-top:14px}
.podium div{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.m1{background:var(--gold);color:#241c00}.m2{background:var(--silver);color:#11161b}.m3{background:var(--bronze);color:#fff}
.podium .who{flex:1;min-width:0}
.podium .who b,.podium .who small{display:block}

/* live */
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.court{border-radius:var(--radius);padding:14px;background:var(--brand);color:var(--brand-ink)}
.court.mine{outline:4px solid var(--accent)}
.court .cn{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.8;font-weight:600}
.court .vs{font-family:var(--display);font-size:20px;font-weight:800;line-height:1.2;margin-top:4px}
.court .vs span{display:block;font-family:var(--body);font-size:12px;font-weight:500;opacity:.8;margin:2px 0 6px}
.court.done{opacity:.55}
.ondeck{display:grid;gap:6px}
.ondeck div{padding:8px 10px;background:var(--surface-2);border-radius:10px;font-size:14px}

/* phone-first touches */
html{-webkit-tap-highlight-color:transparent}
.btn,.gbtn,.hbtn,nav button{min-height:44px;touch-action:manipulation}
.btn.small,.btn.icon{min-height:36px}
.score{height:48px;font-size:20px}
@media (max-width:560px){
  main{padding:12px}
  .card{padding:14px;border-radius:12px;margin-bottom:12px}
  h2{font-size:19px}
  .top{padding:10px 12px 6px;gap:10px}
  .top h1{font-size:18px}
  .ball{width:28px;height:28px}
  .acct .who{display:none}
  nav{padding:4px 12px 10px}
  .hero h2{font-size:23px}
  .facts{grid-template-columns:1fr}
  .form .btn.big,.form .row .btn{flex:1}
  .gbtn{width:100%;justify-content:center}
  .matches,.courts,.cols{grid-template-columns:1fr}
  .court .vs{font-size:19px}
  .stats{grid-template-columns:repeat(3,1fr)}
  table{font-size:13.5px}
  th,td{padding:8px 4px}
  .steps li{padding:8px}
}

/* player navigation */
nav[hidden]{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(20,40,25,.06)}
.bnav[hidden]{display:none}
.bnav button{flex:1;max-width:120px;min-height:52px;background:none;border:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.bnav button svg{width:24px;height:24px}
.bnav button.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
body.player main{padding-bottom:20px}
body.player footer{padding-bottom:96px}
body.player header{position:static}
.nextup{background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.nextup small{display:block;color:inherit;opacity:.75;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:11.5px}
.nextup b{display:block;font-family:var(--display);font-size:24px;line-height:1.15;margin:2px 0}
.nextup span{font-weight:600}
.glist{display:grid;gap:8px}
.grow{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.grow.now{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface-2))}
.grow .rd b,.grow .rd small,.grow .opp small{display:block}
.grow .rd b{font-size:13.5px}
.grow .opp{min-width:0;overflow-wrap:anywhere}
@media (max-width:420px){.grow{grid-template-columns:1fr auto}.grow .rd{grid-column:1/-1;display:flex;gap:8px;align-items:baseline}}

/* raffle */
.winner{font-family:var(--display);font-size:clamp(34px,8vw,64px);font-weight:800;text-align:center;padding:14px 0 4px;line-height:1.05}
.tix{display:inline-flex;align-items:center;gap:6px}
.tix b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
tr.won td{color:var(--muted);text-decoration:line-through}

/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,20,12,.82);display:grid;place-items:center;padding:16px}
.reveal{background:var(--surface);border-radius:20px;padding:28px 22px;text-align:center;max-width:520px;width:100%}
.reveal .n{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.reveal .big{font-family:var(--display);font-size:clamp(30px,8vw,46px);font-weight:800;margin:10px 0 6px;line-height:1.05}
.reveal .ppl{font-size:20px;font-weight:600}
.reveal .poolchip{display:inline-block;margin-top:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:4px 14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}
footer{max-width:1100px;margin:0 auto;padding:4px 16px 28px;color:var(--muted);font-size:12.5px}
@media print{header nav,.btn,footer,.acct{display:none}body{background:#fff}.card{box-shadow:none}}

/* chat */
.bnav .ico{position:relative;display:inline-flex}
.bnav button>span:last-child{white-space:nowrap;font-size:11px;letter-spacing:-.01em}
.nbadge{position:absolute;top:-6px;right:-10px;background:var(--danger);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
#nav .nbadge{position:static;display:inline-grid;margin-left:6px;vertical-align:middle}
.chathead{padding:12px 14px}
.chathead small{display:block;margin-top:2px}
.chatcard{padding:12px}
.chatlog{display:flex;flex-direction:column;gap:2px;min-height:40vh}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:86%;margin-top:8px}
.msg.cont{margin-top:2px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg .who{font-size:12px;font-weight:600;color:var(--muted);margin:0 6px 3px}
.msg .who time{font-weight:400;margin-left:4px}
.hostb{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px;font-size:10.5px;font-weight:700}
.bubble{position:relative;background:var(--surface-2);border-radius:16px;padding:9px 13px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.35}
.msg.me .bubble{background:var(--brand);color:var(--brand-ink)}
.msg.host:not(.me) .bubble{background:color-mix(in srgb,var(--accent) 35%,var(--surface-2))}
.mdel{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;line-height:1;cursor:pointer;opacity:0;padding:0}
.msg .bubble:hover .mdel,.msg .bubble:focus-within .mdel{opacity:1}
@media (hover:none){.mdel{opacity:.85}}
.composer{position:sticky;bottom:0;z-index:20;display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:8px 0 10px;margin-top:-4px}
body.player .composer{bottom:calc(66px + env(safe-area-inset-bottom))}
.composer textarea{flex:1;min-height:44px;max-height:140px;resize:none;border-radius:22px;padding:11px 16px;font-size:16px;line-height:1.3}
.composer .btn{border-radius:22px;min-height:44px}
.composer.locked{justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}

/* rotating partners */
.bringlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bringlist li{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;background:var(--surface-2);border-radius:10px}
.bringlist li span{text-align:right;color:var(--muted)}
.bringlist.small li{padding:6px 10px;font-size:14px}
.already{display:grid;gap:6px;margin-top:-4px}
.mrow.win .tn:has(.pchips)::after{content:none}
.mrow.win{background:color-mix(in srgb,var(--good) 10%,transparent)}
.pchips.tight{gap:4px;margin:0}
.pchip.sm{min-height:34px;padding:5px 10px;font-size:13.5px}
.prow{grid-template-columns:auto 1fr 110px auto}

<script type="module">
'use strict';
const KEY = 'pickleball-party-v1';
const TAB_LABELS = {setup:'Setup',players:'Players',play:'Play',board:'Leaderboard',chat:'Chat',register:'Event',mine:'My games',live:'Now playing',rules:'Rules'};
const BN_LABELS = {register:'Event',mine:'My games',live:'Courts',chat:'Chat',board:'Ranks',rules:'Rules'};
const ADMIN_TABS = ['setup','players','play','board','chat','register','rules'];
const ICON_ATTR = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
const ICONS = {
  register:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  mine:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>',
  live:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/>',
  rules:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/><path d="M9 7h7M9 11h5"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/>',
  board:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM16 6h3a2 2 0 0 1-2 4h-1M8 6H5a2 2 0 0 0 2 4h1M12 13v4M8 21h8M9 17h6"/>'
};
const SAMPLE = ['Eddie + Jess','Marco + Lina','Sam + Priya','Dave + Kim','Tony + Grace','Ben + Chloe','Ray','Mia','Josh','Ana'];

function blank(){return {event:{name:'Pickleball Party',date:'',time:'',start:'16:00',end:'19:45',location:'Build Pickleball, Chino Hills',notes:'Pizza provided. Kids welcome in the kids’ zone.',courts:4,minutes:15,rounds:7,sitKids:true,regOpen:true,published:false,chatOn:true,prizes:{champ:'Trophy + gift card each',runner:'Gift card each'}},players:[],rounds:[],bringing:[],chatEpoch:'main'}}
function normalize(d){
  const b=blank();d=Object.assign(b,d||{});
  d.event=Object.assign(blank().event,d.event||{});
  const pz=d.event.prizes||{};d.event.prizes={champ:typeof pz.champ==='string'?pz.champ:blank().event.prizes.champ,runner:typeof pz.runner==='string'?pz.runner:blank().event.prizes.runner};
  ['teams','games','bracket','raffle'].forEach(k=>delete d[k]);
  ['pools','funNames','payInfo','fee'].forEach(k=>delete d.event[k]);
  if(!Array.isArray(d.players))d.players=[];
  if(!Array.isArray(d.rounds))d.rounds=[];
  if(!Array.isArray(d.bringing))d.bringing=[];
  if(!d.chatEpoch)d.chatEpoch='main';
  return d;
}

let S = blank();
let BE = null, user = null, isAdmin = false, regs = [], myReg = null, ready = false;
let unRegs = null, unMy = null;
let tab = null; try{tab=localStorage.getItem(KEY+':tab')}catch(e){}
const ui = {swap:null, form:null, editing:false, bulk:'', busy:false};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const P = id => S.players.find(p => p.id === id);
const nm = id => (P(id)||{name:'(removed)'}).name;
const pair = ids => ids.map(nm).join(' & ');
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function fmtDate(){if(!S.event.date)return '';return new Date(S.event.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}
function fmtTime(t){if(!/^\d{1,2}:\d{2}/.test(t||''))return '';let [h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return h+(m?':'+String(m).padStart(2,'0'):'')+' '+ap}
function timeRange(){const e=S.event,a=fmtTime(e.start),b=fmtTime(e.end);if(a&&b)return a+' – '+b;if(a)return 'Starts '+a;return e.time||''}
function updateHeader(){$('#title').textContent=S.event.name||'Pickleball Party';$('#subtitle').textContent=[fmtDate(),isAdmin&&S.players.length?S.players.length+' players':''].filter(Boolean).join(' · ')||timeRange()||'Pickleball';document.title=(S.event.name||'Pickleball Party')}
const cloud = () => BE && BE.mode === 'cloud';
function myPlayerIds(){return (user&&myReg)?[0,1].map(i=>'r_'+user.uid+'_'+i).filter(id=>P(id)):[]}
function canSeeBoard(){return isAdmin||S.event.published}
function kidsTotal(){return regs.reduce((s,r)=>s+(parseInt(r.kids)||0),0)}
const active = () => S.players.filter(p=>!p.out);
const lastRound = () => S.rounds[S.rounds.length-1]||null;
const step = () => (parseFloat(S.event.minutes)||15)+3;
function winSide(g){if(!g||g.sa==null||g.sb==null||g.sa===g.sb)return null;return g.sa>g.sb?'a':'b'}
const roundDone = r => !!r && r.games.every(winSide);
function courtPlan(n){const c=Math.max(1,parseInt(S.event.courts)||1),playing=Math.min(c*4,Math.floor(n/4)*4);return {playing,courts:playing/4,sit:n-playing}}
const sitWord = () => S.event.sitKids?'Sitting out to watch the kids’ zone':'Sitting out';
const BRING_TAG='Bringing: ';
let liveBring=null; // live public list from Firestore (null until the rules allow it)
function bringList(){
  const m=new Map();
  (S.bringing||[]).forEach(x=>m.set(x.uid||('n:'+x.name),x));
  if(liveBring)liveBring.forEach(x=>m.set(x.uid,x));
  return [...m.values()].filter(x=>x.item).sort((a,b)=>a.name.localeCompare(b.name));
}
function bringUL(list,small){return `<ul class="bringlist ${small?'small':''}">${list.map(x=>`<li><b>${esc(x.name)}</b><span>${esc(x.item)}</span></li>`).join('')}</ul>`}
function regBring(r){if(!r)return '';if(r.bring)return r.bring;const n=r.note||'';if(n.startsWith(BRING_TAG)){const k=n.indexOf(' · ');return k<0?n.slice(BRING_TAG.length):n.slice(BRING_TAG.length,k)}return ''}
function regNote(r){if(!r)return '';const n=r.note||'';if(!r.bring&&n.startsWith(BRING_TAG)){const k=n.indexOf(' · ');return k<0?'':n.slice(k+3)}return n}
const champGame = () => {for(const r of S.rounds)for(const g of r.games)if(g.champ)return g;return null};

/* ---------- stats ---------- */
function computeStats(){
  const st={};
  const get=id=>st[id]||(st[id]={id,W:0,L:0,PF:0,PA:0,GP:0,sit:0,sched:0,lastSit:-1,partners:{},opps:{}});
  S.players.forEach(p=>get(p.id));
  S.rounds.forEach((r,ri)=>{
    (r.sit||[]).forEach(id=>{const s=get(id);s.sit++;s.lastSit=ri});
    r.games.forEach(g=>{
      [[g.a,g.b],[g.b,g.a]].forEach(([me,them])=>me.forEach(x=>{const s=get(x);s.sched++;me.forEach(y=>{if(y!==x)s.partners[y]=(s.partners[y]||0)+1});them.forEach(y=>s.opps[y]=(s.opps[y]||0)+1)}));
      const w=winSide(g);if(!w||g.champ)return;
      [['a',g.a,g.sa,g.sb],['b',g.b,g.sb,g.sa]].forEach(([side,ids,f,a])=>ids.forEach(x=>{const s=get(x);s.GP++;s.PF+=f;s.PA+=a;if(w===side)s.W++;else s.L++}));
    });
  });
  return st;
}
function ranking(st){
  st=st||computeStats();
  return S.players.map(p=>st[p.id]).filter(Boolean).sort((x,y)=>{
    if(!!y.GP-!!x.GP)return !!y.GP-!!x.GP;
    const wx=x.GP?x.W/x.GP:0,wy=y.GP?y.W/y.GP:0;
    const dx=x.GP?(x.PF-x.PA)/x.GP:0,dy=y.GP?(y.PF-y.PA)/y.GP:0;
    return wy-wx||y.W-x.W||dy-dx||y.PF-x.PF||nm(x.id).localeCompare(nm(y.id));
  });
}

/* ---------- saving ---------- */
let saveTimer=null, lastSent=null, dirty=false, pendingSave=null;
function save(now){
  if(!isAdmin||!BE)return;
  dirty=true;clearTimeout(saveTimer);pendingSave=null;
  const go=()=>{const json=JSON.stringify(S);lastSent=json;dirty=false;
    Promise.resolve(BE.saveState(json,{regOpen:!!S.event.regOpen,chatOn:!!S.event.chatOn,chatEpoch:S.chatEpoch})).catch(e=>{console.error(e);toast('Save failed: '+(e.code||e.message||'check your connection'))})};
  if(now)go();else{pendingSave=go;saveTimer=setTimeout(()=>{pendingSave=null;go()},350)}
}
function flushSave(){if(pendingSave){clearTimeout(saveTimer);const g=pendingSave;pendingSave=null;g()}}
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave()});
let stateMissing=false;
function onState(json){
  stateMissing=!json;
  if(isAdmin&&!json&&cloud()){ready=true;save(true);return}
  if(isAdmin&&(dirty||json===lastSent)){ready=true;return}
  try{S=json?normalize(JSON.parse(json)):blank()}catch(e){S=blank()}
  ready=true;
  if(isAdmin){const ch=syncRegs();if(cloud()&&!metaSynced){metaSynced=true;save(true)}else if(ch)save()}
  ensureChat();
  renderKeep();
}
let metaSynced=false;

/* ---------- registrations -> players ---------- */
function syncRegs(){
  if(!cloud()||!isAdmin)return false;
  let ch=false;const live=new Set();
  regs.forEach(r=>{
    const names=[r.name,r.partner].map(s=>String(s||'').trim()).filter(Boolean);
    const grp=names.length>1?'r_'+r.id:'';
    names.forEach((n,i)=>{
      const id='r_'+r.id+'_'+i;live.add(id);const p=P(id);
      if(!p){S.players.push({id,name:n,group:grp,src:'reg'});ch=true}
      else{if(p.name!==n){p.name=n;ch=true}if(p.group!==grp){p.group=grp;ch=true}}
    });
  });
  if((S.bringing||[]).length){S.bringing=[];ch=true}
  const before=S.players.length;
  S.players=S.players.filter(p=>p.src!=='reg'||live.has(p.id));
  if(S.players.length!==before)ch=true;
  return ch;
}

/* ---------- actions ---------- */
function addPlayers(text){
  let added=0;
  text.split(/\n+/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    const parts=line.split(/\s*\+\s*/).map(s=>s.trim()).filter(Boolean);
    const group=parts.length>1?('g'+uid().slice(0,4)):'';
    parts.forEach(name=>{S.players.push({id:uid(),name,group,src:'manual'});added++});
  });
  save();toast(added+' player'+(added===1?'':'s')+' added');
}
function newRound(isFinal){
  const st=computeStats();
  const act=active().map(p=>p.id);
  if(act.length<4){toast('Need at least 4 players marked as playing');return false}
  const courts=Math.max(1,parseInt(S.event.courts)||1);
  let champ=null,pool=act;
  if(isFinal){
    const top=ranking(st).filter(x=>x.GP>0&&P(x.id)&&!P(x.id).out).slice(0,4).map(x=>x.id);
    if(top.length<4){toast('Play a round or two first so there are 4 players on the leaderboard');return false}
    champ={court:1,champ:true,a:[top[0],top[3]],b:[top[1],top[2]],sa:null,sb:null};
    pool=act.filter(id=>!top.includes(id));
  }
  const cap=Math.max(0,Math.min((courts-(champ?1:0))*4,Math.floor(pool.length/4)*4));
  const lastRi=S.rounds.length-1;
  const order=shuffle(pool).sort((x,y)=>{const a=st[x],b=st[y];return a.sit-b.sit||(a.lastSit===lastRi)-(b.lastSit===lastRi)||b.sched-a.sched});
  const sit=order.slice(0,pool.length-cap);
  const playing=pool.filter(id=>!sit.includes(id));
  const rating=id=>{const s=st[id];return s.GP?s.W/s.GP:0.5};
  const couple=(x,y)=>{const a=P(x),b=P(y);return !!(a&&b&&a.group&&a.group===b.group)};
  let best=[],bestCost=Infinity;
  if(playing.length){
    for(let k=0;k<4000;k++){
      const sh=shuffle(playing);let cost=0;const gs=[];
      for(let i=0;i<sh.length;i+=4){
        const [p1,p2,p3,p4]=sh.slice(i,i+4);
        const pr=(x,y)=>st[x].partners[y]||0;
        cost+=pr(p1,p2)**2*100+pr(p3,p4)**2*100;
        [p1,p2].forEach(x=>[p3,p4].forEach(y=>{cost+=(st[x].opps[y]||0)*6}));
        if(couple(p1,p2))cost+=40;if(couple(p3,p4))cost+=40;
        cost+=Math.abs(rating(p1)+rating(p2)-rating(p3)-rating(p4))*20;
        gs.push({a:[p1,p2],b:[p3,p4]});
      }
      if(cost<bestCost){bestCost=cost;best=gs;if(cost===0)break}
    }
  }
  const startCourt=champ?2:1;
  const games=(champ?[champ]:[]).concat(best.map((g,i)=>({court:startCourt+i,a:g.a,b:g.b,sa:null,sb:null})));
  S.rounds.push({n:S.rounds.length+1,final:!!isFinal,games,sit});
  ui.swap=null;save(true);
  return true;
}
function setScore(key,val){
  const v=val===''?null:Math.max(0,Math.min(99,parseInt(val,10)||0));
  const [ri,gi,side]=key.split(':');const r=S.rounds[+ri];if(!r)return;const g=r.games[+gi];if(!g)return;
  g['s'+side]=v;save();
}
function posGet(r,pos){const m=pos.split(':');return m[0]==='s'?r.sit[+m[1]]:r.games[+m[1]][m[2]][+m[3]]}
function posSet(r,pos,v){const m=pos.split(':');if(m[0]==='s')r.sit[+m[1]]=v;else r.games[+m[1]][m[2]][+m[3]]=v}
function posGame(r,pos){const m=pos.split(':');return m[0]==='g'?r.games[+m[1]]:null}
function swapPick(pos){
  const r=lastRound();if(!r)return;
  if(!ui.swap){ui.swap=pos;return}
  if(ui.swap===pos){ui.swap=null;return}
  const g1=posGame(r,ui.swap),g2=posGame(r,pos);
  if([g1,g2].some(g=>g&&(g.sa!=null||g.sb!=null))&&!confirm('That game already has a score. Swap anyway?')){ui.swap=null;return}
  const x=posGet(r,ui.swap),y=posGet(r,pos);posSet(r,ui.swap,y);posSet(r,pos,x);
  ui.swap=null;save();toast(`Swapped ${nm(x)} and ${nm(y)}`);
}

/* ---------- chat ---------- */
const chat={key:null,un:null,msgs:[],status:'off',draft:'',busy:false};
function ensureChat(){
  const k=(BE&&S.event.chatOn&&user)?S.chatEpoch+'|'+user.uid:null;
  if(k===chat.key)return;
  if(chat.un){chat.un();chat.un=null}
  chat.key=k;chat.msgs=[];
  if(!k){chat.status='off';return}
  chat.status='loading';
  chat.un=BE.watchChat(S.chatEpoch,list=>{chat.msgs=list;chat.status='ok';onChat()},e=>{console.error(e);chat.status='blocked';onChat()});
}
const seenKey=()=>KEY+':seen:'+S.chatEpoch;
function lastSeen(){try{return Number(localStorage.getItem(seenKey()))||0}catch(e){return 0}}
function markSeen(){const t=chat.msgs.reduce((m,x)=>Math.max(m,x.at||0),0);if(t>lastSeen()){try{localStorage.setItem(seenKey(),String(t))}catch(e){}}}
function unread(){if(!user||tab==='chat')return 0;const t=lastSeen();return chat.msgs.filter(m=>m.uid!==user.uid&&(m.at||0)>t).length}
function canPost(){return isAdmin||!cloud()||!!myReg}
function nearBottom(){return window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-160}
function chatBottom(){window.scrollTo(0,document.documentElement.scrollHeight)}
function onChat(){
  if(!ready)return;
  if(tab==='chat'){
    const log=document.getElementById('chatlog');
    if(log&&chat.status==='ok'){const nb=nearBottom();log.innerHTML=chatLogHtml();markSeen();renderNav();if(nb)chatBottom();return}
    renderKeep();markSeen();chatBottom();return;
  }
  renderNav();
}
function fmtClock(ms){return new Date(ms).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function chatLogHtml(){
  if(chat.status==='loading')return '<div class="empty">Loading…</div>';
  if(!chat.msgs.length)return '<div class="empty">No messages yet. Say hi!</div>';
  let prev=null;
  return chat.msgs.map(m=>{
    const mine=user&&m.uid===user.uid,cont=prev&&prev.uid===m.uid&&(m.at-prev.at)<5*60000;prev=m;
    const del=(mine||isAdmin)?`<button class="mdel" data-action="chatDel" data-id="${esc(m.id)}" aria-label="Delete message">×</button>`:'';
    return `<div class="msg ${mine?'me':''} ${m.host?'host':''} ${cont?'cont':''}">${cont?'':`<div class="who">${esc(mine?'You':m.name)}${m.host?' <span class="hostb">Host</span>':''} <time>${fmtClock(m.at)}</time></div>`}<div class="bubble">${esc(m.text)}${del}</div></div>`;
  }).join('');
}
function vChat(){
  if(!S.event.chatOn)return `<section class="card empty"><p>The event chat is off right now.</p>${isAdmin?'<button class="btn primary" data-action="chatOnBtn">Turn chat on</button>':''}</section>`;
  if(!user)return `<section class="card" style="text-align:center"><h2>Event chat</h2><p class="muted" style="margin-top:0">Sign in to see what everyone's saying.</p>${signInBtn()}</section>`;
  if(chat.status==='blocked')return `<section class="card"><h2>Event chat</h2>${isAdmin?'<div class="banner">Chat needs the latest Firebase rules. Paste the new rules into Firebase → Firestore Database → Rules, then Publish.</div>':'<p class="muted">The chat isn’t open yet. Check back soon.</p>'}</section>`;
  const head=`<section class="card chathead"><div class="spread"><div><h2 style="margin:0">Event chat</h2><small>Everyone at the event can read this. It clears after the event.</small></div>${isAdmin?'<button class="btn small" data-action="clearChat">Clear chat</button>':''}</div></section>`;
  const composer=canPost()?`<form class="composer" data-chat-form><textarea id="chatInput" rows="1" maxlength="500" placeholder="Message everyone…" aria-label="Message">${esc(chat.draft)}</textarea><button class="btn primary" type="submit" ${chat.busy?'disabled':''}>Send</button></form>`
    :`<div class="composer locked"><span>Register to join the chat.</span><button class="btn small primary" data-tab="register">Register</button></div>`;
  return head+`<section class="card chatcard"><div id="chatlog" class="chatlog" aria-live="polite">${chatLogHtml()}</div></section>`+composer;
}
async function sendChat(){
  const text=String(chat.draft||'').trim().slice(0,500);
  if(!text||chat.busy)return;
  const name=(isAdmin?(myReg&&myReg.name)||(user.displayName||'Host').split(' ')[0]:(myReg&&myReg.name))||'Guest';
  chat.busy=true;
  try{await BE.sendChat(S.chatEpoch,{uid:user.uid,name:name.slice(0,40),text,host:!!isAdmin});chat.draft='';const el=document.getElementById('chatInput');if(el){el.value='';el.style.height=''}}
  catch(e){console.error(e);toast(e&&e.code==='permission-denied'?'The chat is closed right now':'Message not sent. Check your connection.')}
  chat.busy=false;
}

/* ---------- views ---------- */

function signInBtn(label){return `<button class="gbtn" data-action="signin">${GOOGLE_G}${esc(label||'Sign in with Google')}</button>`}
function notPosted(){return `<div class="card empty"><p>Courts and partners will be posted here at the event.</p>${tab!=='register'?'<button class="btn" data-tab="register">Event info</button>':''}</div>`}
function courtLabel(g){return g.champ?'Championship · Court '+g.court:'Court '+g.court}

/* score card used on the Play page (admin) */
function scoreCard(r,ri,g,gi,editable){
  const w=winSide(g),tie=g.sa!=null&&g.sb!=null&&g.sa===g.sb,latest=ri===S.rounds.length-1;
  const chip=(side,i)=>{const pos=`g:${gi}:${side}:${i}`,on=ui.swap===pos;return latest&&editable?`<button class="pchip sm ${on?'on':''} ${ui.swap&&!on?'target':''}" data-action="swapPick" data-pos="${pos}">${esc(nm(g[side][i]))}</button>`:`<span>${esc(nm(g[side][i]))}</span>`};
  const row=side=>`<div class="mrow ${w===side?'win':''}"><span class="tn"><span class="pchips tight">${chip(side,0)}${chip(side,1)}</span></span><input class="score" type="number" inputmode="numeric" min="0" max="99" data-score="${ri}:${gi}:${side}" value="${g['s'+side]??''}" aria-label="Score for ${esc(pair(g[side]))}"></div>`;
  return `<div class="match ${w?'done':''} ${tie?'tie':''} ${g.champ?'champ':''}"><div class="mhead"><span>${courtLabel(g)}</span>${w?'<span>Final</span>':''}</div>${row('a')}${row('b')}${tie?'<div class="tiemsg">Tied: play one sudden-death rally</div>':''}</div>`;
}
/* read-only court card (players) */
function courtCard(g,mine){
  const w=winSide(g),isMine=g.a.concat(g.b).some(id=>mine.has(id));
  const side=s=>`<div class="cside ${w===s?'won':''}"><span>${g[s].map(id=>`<b class="${mine.has(id)?'me':''}">${esc(nm(id))}</b>`).join(' & ')}</span>${g['s'+s]!=null?`<em>${g['s'+s]}</em>`:''}</div>`;
  return `<div class="court ${w?'done':''} ${isMine?'mine':''} ${g.champ?'champ':''}"><div class="cn">${courtLabel(g)}${isMine?' · You':''}</div>${side('a')}<div class="vsmark">vs</div>${side('b')}</div>`;
}

    ['setup','Show courts and leaderboard to everyone',!!e.published,e.published?'Visible to players':'Hidden from players'],
    ['play','Play the rounds',played>=target,`${played} of ${target} rounds`],

  <section class="card"><h2>What players see</h2><div class="grid2" style="grid-template-columns:1fr">
    <label class="check"><input type="checkbox" data-bind="regOpen" ${e.regOpen?'checked':''}> Registration open</label>
    <label class="check"><input type="checkbox" data-bind="published" ${e.published?'checked':''}> Show courts, partners and leaderboard to everyone</label>
    <label class="check"><input type="checkbox" data-bind="chatOn" ${e.chatOn?'checked':''}> Event chat on</label>
  </div>${cloud()?`<div class="row" style="margin-top:12px"><button class="btn" data-action="copyLink">Copy site link</button><button class="btn" data-tab="register">Preview sign-up page</button></div>`:''}</section>
  <section class="card"><h2>Event</h2><div class="grid2">
    <label>Event name<input data-bind="name" value="${esc(e.name)}"></label>
    <label>Date<input type="date" data-bind="date" min="2025-01-01" max="2035-12-31" value="${esc(e.date)}"></label>
    <label>Start time<input type="time" step="900" data-bind="start" value="${esc(e.start)}"></label>
    <label>End time<input type="time" step="900" data-bind="end" value="${esc(e.end)}"></label>
    <label>Location<input data-bind="location" value="${esc(e.location)}"></label>
    <label style="grid-column:1/-1">Notes for players (food, what's included)<textarea data-bind="notes" rows="4" style="min-height:96px">${esc(e.notes)}</textarea></label>
  </div></section>
  <section class="card"><h2>Format</h2><div class="grid2">
    <label>Courts<input type="number" min="1" max="12" data-bind="courts" value="${esc(e.courts)}"></label>
    <label>Minutes per game<input type="number" min="5" max="30" data-bind="minutes" value="${esc(e.minutes)}"></label>
    <label>Rounds before the championship<input type="number" min="1" max="20" data-bind="rounds" value="${esc(e.rounds)}"></label>
    <label class="check" style="grid-column:1/-1"><input type="checkbox" data-bind="sitKids" ${e.sitKids?'checked':''}> Players sitting out watch the kids’ zone</label>
  </div><p class="muted" style="margin:10px 0 0">${n?`${n} playing → ${cp.courts} court${cp.courts===1?'':'s'} in use${cp.sit?`, ${cp.sit} sit${cp.sit===1?'s':''} out each round (it rotates)`:', nobody sits out'}. `:''}${target} rounds ≈ ${target*step()} min of play.</p></section>
  <section class="card"><h2>Prizes</h2><div class="grid2">

    ${regRows.length?`<div class="tablewrap"><table><thead><tr><th>Players</th><th>Email</th><th class="num">Kids</th><th>Note</th><th></th></tr></thead><tbody>${regRows.map(r=>`<tr><td><b>${esc(r.name)}</b>${r.partner?' & '+esc(r.partner):''}</td><td><small>${esc(r.email)}</small></td><td class="num">${esc(r.kids||0)}</td><td><small>${esc(regNote(r))}</small></td><td><button class="btn icon small" data-action="delReg" data-id="${esc(r.id)}" aria-label="Remove registration">✕</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No one has registered yet. Share the site link.</div>'}

  <section class="card"><h2>Add walk-in players</h2>

    <textarea id="bulk" placeholder="Eddie + Jess&#10;Sam&#10;Alex">${esc(ui.bulk)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-action="addPlayers">Add players</button>${S.players.length?'':'<button class="btn" data-action="sample">Load 16 sample names</button>'}</div>
  </section>
  <section class="card"><div class="spread" style="margin-bottom:6px"><h2 style="margin:0">All players (${all})</h2><span class="pill">${n} playing</span></div>
    <p class="muted" style="margin:0 0 12px;font-size:13.5px">${n>=4?`${cp.courts} court${cp.courts===1?'':'s'} in use${cp.sit?` · ${cp.sit} sit${cp.sit===1?'s':''} out each round, taking turns`:' · everyone plays every round'}.`:'Need at least 4 players.'} Untick <b>Playing</b> for anyone who hasn't arrived or has left.</p>
    ${S.players.length?`<div class="plist"><div class="prow muted" style="font-size:12px;font-weight:600"><span>Playing</span><span>Name</span><span>Couple tag</span><span></span></div>${S.players.map(p=>`<div class="prow ${p.out?'off':''}"><input type="checkbox" data-here="${p.id}" ${p.out?'':'checked'} aria-label="Playing">${p.src==='reg'?`<span class="static">${esc(p.name)}<span class="chip">Registered</span></span><span class="muted" style="font-size:13px">${p.group?'Couple':'—'}</span><span></span>`:`<input data-pname="${p.id}" value="${esc(p.name)}" aria-label="Name"><input data-pgroup="${p.id}" value="${esc(p.group)}" placeholder="—" aria-label="Couple tag"><button class="btn icon" data-action="delPlayer" data-id="${p.id}" aria-label="Remove ${esc(p.name)}">✕</button>`}</div>`).join('')}</div>`:'<div class="empty">No players yet.</div>'}
  </section>`;
}

function vPlay(){
  const r=lastRound(),ri=S.rounds.length-1,target=parseInt(S.event.rounds)||7,n=active().length,cp=courtPlan(n);
  const regular=S.rounds.filter(x=>!x.final).length,cg=champGame();
  let head;
  if(!r){
    head=`<section class="card"><h2>Ready to start</h2><p class="muted" style="margin-top:0">${n} playing · ${cp.courts} court${cp.courts===1?'':'s'}${cp.sit?` · ${cp.sit} sit out each round`:''}. The site picks partners so nobody repeats a partner until it has to, and keeps games balanced.</p><button class="btn primary big" data-action="newRound" ${n<4?'disabled':''}>Start round 1</button></section>`;
  } else {
    const done=roundDone(r),scored=r.games.filter(winSide).length,any=r.games.some(g=>g.sa!=null||g.sb!=null);
    const title=r.final?'Championship round':`Round ${r.n} of ${target}`;
    let next='';
    if(done&&!cg)next=regular<target?`<button class="btn primary big" data-action="newRound">Start round ${r.n+1}</button><button class="btn" data-action="champRound">Go to championship</button>`:`<button class="btn accent big" data-action="champRound">Start championship game</button><button class="btn" data-action="newRound">Play another round</button>`;
    else if(done&&cg)next=`<button class="btn" data-tab="board">See final results</button>`;
    head=`<section class="card"><div class="spread"><h2 style="margin:0">${title}</h2><span class="pill ${done?'ok':''}">${scored}/${r.games.length} scores in</span></div>
      ${done?'':`<p class="muted" style="margin:8px 0 0">Enter each score as games finish. ${any?'':'Need a change? Tap two names to swap them, or reshuffle.'}</p>`}
      <div class="row" style="margin-top:12px">${next}${any?'':`<button class="btn" data-action="reshuffle">Reshuffle</button>`}<button class="btn danger small" data-action="delRound">Delete round</button></div></section>`;
  }
  let body='';
  if(r){
    const swapBar=ui.swap?`<section class="card swapcard active"><div class="spread"><span><b>${esc(nm(posGet(r,ui.swap)))}</b> selected. Tap who to swap with.</span><button class="btn small" data-action="swapCancel">Cancel</button></div></section>`:'';
    const sit=r.sit&&r.sit.length?`<section class="card"><h3 style="margin-bottom:8px">${sitWord()}</h3><div class="pchips">${r.sit.map((id,i)=>{const pos=`s:${i}`,on=ui.swap===pos;return `<button class="pchip ${on?'on':''} ${ui.swap&&!on?'target':''}" data-action="swapPick" data-pos="${pos}">${esc(nm(id))}</button>`}).join('')}</div></section>`:'';
    body=swapBar+`<div class="matches">${r.games.map((g,gi)=>scoreCard(r,ri,g,gi,true)).join('')}</div>`+sit;
    const earlier=S.rounds.slice(0,-1).map((x,i)=>({x,i})).reverse();
    if(earlier.length)body+=`<h3 style="margin:18px 0 8px">Earlier rounds</h3>`+earlier.map(({x,i})=>`<details class="card past"><summary><b>${x.final?'Championship round':'Round '+x.n}</b><span class="pill ${roundDone(x)?'ok':'warn'}">${roundDone(x)?'Done':'Missing scores'}</span></summary><div class="matches" style="margin-top:12px">${x.games.map((g,gi)=>scoreCard(x,i,g,gi,false)).join('')}</div></details>`).join('');
  }
  return head+body;
}

function vLive(){
  if(!canSeeBoard())return notPosted();
  const r=lastRound(),mine=new Set(myPlayerIds());
  if(!r)return '<section class="card empty">The first round starts soon. Check back here for your court.</section>';
  const myG=r.games.find(g=>g.a.concat(g.b).some(id=>mine.has(id)));
  const mySit=(r.sit||[]).filter(id=>mine.has(id));
  let banner='';
  if(myG&&!winSide(myG)){const side=myG.a.some(id=>mine.has(id))?'a':'b',me=myG[side].find(id=>mine.has(id)),pt=myG[side].find(id=>id!==me),op=myG[side==='a'?'b':'a'];banner=`<div class="nextup"><small>${myPlayerIds().length>1?esc(nm(me))+' · ':''}Go to court ${myG.court}</small><b>With ${esc(nm(pt))}</b><span>vs ${esc(pair(op))}</span></div>`}
  else if(mySit.length)banner=`<div class="banner">${mySit.map(nm).map(esc).join(' & ')}: ${S.event.sitKids?'sitting out this round to watch the kids’ zone':'sitting out this round'}. You're in next round.</div>`;
  return `${banner}<section class="card"><div class="spread" style="margin-bottom:12px"><h2 style="margin:0">${r.final?'Championship round':'Round '+r.n}</h2><span class="pill">${r.games.filter(winSide).length}/${r.games.length} done</span></div><div class="courts">${r.games.map(g=>courtCard(g,mine)).join('')}</div>${r.sit&&r.sit.length?`<p class="muted" style="margin:14px 0 0"><b>${sitWord()}:</b> ${r.sit.map(nm).map(esc).join(', ')}</p>`:''}</section>`;
}

function vMine(){
  if(!user)return `<section class="card" style="text-align:center"><h2>My games</h2><p class="muted" style="margin-top:0">Sign in to see your games.</p>${signInBtn()}</section>`;
  if(!myReg)return `<section class="card" style="text-align:center"><h2>My games</h2><p class="muted" style="margin-top:0">You're not registered yet.</p><button class="btn primary big" data-tab="register">Register</button></section>`;
  if(!canSeeBoard())return notPosted();
  const ids=myPlayerIds();
  if(!ids.length)return notPosted();
  const st=computeStats(),rk=ranking(st),r=lastRound();
  const blocks=ids.map(id=>{
    const s=st[id],rank=rk.findIndex(x=>x.id===id)+1;
    let now='';
    if(r){const g=r.games.find(g=>g.a.includes(id)||g.b.includes(id));
      if(g&&!winSide(g)){const side=g.a.includes(id)?'a':'b',pt=g[side].find(x=>x!==id),op=g[side==='a'?'b':'a'];now=`<div class="nextup"><small>${ids.length>1?esc(nm(id))+' · ':''}${r.final?'Championship round':'Round '+r.n} · go to court ${g.court}</small><b>With ${esc(nm(pt))}</b><span>vs ${esc(pair(op))}</span></div>`}
      else if((r.sit||[]).includes(id))now=`<div class="banner">${ids.length>1?esc(nm(id))+': ':''}${S.event.sitKids?'Sitting out this round to watch the kids’ zone':'Sitting out this round'}. You're in next round.</div>`;
      else if(g)now=`<div class="banner ok">${ids.length>1?esc(nm(id))+': ':''}Game done. Next round starts soon.</div>`;}
    const hist=[];
    S.rounds.forEach(x=>{x.games.forEach(g=>{if(!g.a.includes(id)&&!g.b.includes(id))return;const side=g.a.includes(id)?'a':'b',pt=g[side].find(y=>y!==id),op=g[side==='a'?'b':'a'],w=winSide(g);
      const st2=w?`<span class="pill ${w===side?'ok':''}">${w===side?'Won':'Lost'} ${g['s'+side]}–${g['s'+(side==='a'?'b':'a')]}</span>`:'<span class="pill you">Playing</span>';
      hist.push(`<div class="grow ${w?'':'now'}"><div class="rd"><b>${g.champ?'Championship':x.final?'Final round':'Round '+x.n}</b><small>Court ${g.court}</small></div><div class="opp">with <b>${esc(nm(pt))}</b><small>vs ${esc(pair(op))}</small></div>${st2}</div>`)});
      if((x.sit||[]).includes(id))hist.push(`<div class="grow"><div class="rd"><b>Round ${x.n}</b><small>—</small></div><div class="opp muted">${S.event.sitKids?'Sat out · kids’ zone':'Sat out'}</div><span></span></div>`)});
    return `${now}<section class="card"><div class="spread"><div><h2 style="margin:0">${esc(nm(id))}</h2><small>${s.GP?`${s.W}–${s.L} · ${s.PF-s.PA>0?'+':''}${s.PF-s.PA} points`:'No games yet'}</small></div>${s.GP?`<span class="pill you">#${rank} of ${rk.length}</span>`:''}</div><div class="glist" style="margin-top:14px">${hist.reverse().join('')||'<div class="empty">Your first game will show up here.</div>'}</div></section>`;
  }).join('');
  return blocks+`<button class="btn" style="width:100%" data-tab="board">See the leaderboard</button>`;
}

function vBoard(){
  if(!canSeeBoard())return notPosted();
  const st=computeStats(),rk=ranking(st).filter(x=>x.GP>0),mine=new Set(myPlayerIds()),cg=champGame();
  let champ='';
  if(cg){const w=winSide(cg);
    champ=w?`<section class="card champcard"><small>Champions</small><b>${esc(pair(cg[w]))}</b><span>${esc(S.event.prizes.champ)}</span><div class="ru"><small>Runners-up</small> ${esc(pair(cg[w==='a'?'b':'a']))} · ${esc(S.event.prizes.runner)}</div></section>`
      :`<section class="card champcard"><small>Championship game · Court ${cg.court}</small><b>${esc(pair(cg.a))}</b><span>vs ${esc(pair(cg.b))}</span></section>`}
  if(!rk.length)return champ+'<section class="card empty">The leaderboard fills in as scores come in.</section>';
  const rows=rk.map((x,i)=>{const d=x.PF-x.PA;return `<tr class="${mine.has(x.id)?'mine':''} ${i===3&&!cg?'cutline':''}"><td>${i<3?`<span class="medal m${i+1}">${i+1}</span>`:`<span class="place">${i+1}</span>`}</td><td><b>${esc(nm(x.id))}</b></td><td class="num">${x.W}–${x.L}</td><td class="num">${d>0?'+':''}${d}</td></tr>`}).join('');
  return `${champ}<section class="card"><div class="spread" style="margin-bottom:8px"><h2 style="margin:0">Leaderboard</h2>${cg?'':'<span class="pill">Top 4 play the final</span>'}</div><table class="lb"><thead><tr><th></th><th>Player</th><th class="num">W–L</th><th class="num">+/−</th></tr></thead><tbody>${rows}</tbody></table><p class="muted" style="margin:10px 0 0;font-size:12.5px">Ranked by win rate, then point difference. Sit-outs don't count against you.</p></section>`;
}

function vRules(){
  const m=esc(S.event.minutes||15);
  const sec=(t,body)=>`<section class="card rules"><h2>${t}</h2>${body}</section>`;
  return `<section class="card hero"><h2>Pickleball in 2 minutes</h2><p style="margin-top:0">It's like tennis on a badminton-size court with paddles and a plastic ball. Always doubles tonight: 2 vs 2.</p></section>`
  +sec('Tonight’s game',`<ul class="howlist"><li><b>First to 11.</b> Every rally scores a point, no matter who served.</li><li><b>Time cap: ${m} minutes.</b> When time's up, finish the rally. Whoever is ahead wins. Tied? Play one more rally.</li><li><b>New partner every game.</b> Check <b>Now playing</b> for your court.</li><li><b>Report your score</b> to the organizer when your game ends.</li></ul>`)
  +sec('Serving',`<ol class="rlist"><li>Serve <b>underhand</b>: hit the ball below your waist with an upward swing. Dropping the ball and hitting it after one bounce is fine.</li><li>Stand behind the back line and serve <b>diagonally</b> into the box across from you. It has to clear the <b>kitchen</b> (the zone by the net).</li><li><b>Call the score</b> before you serve: your team's score, the other team's score, then your server number (1 or 2). Example: “5–3–1”.</li><li><b>Win the rally on your serve?</b> You score, switch sides with your partner, and keep serving.</li><li><b>Lose the rally on your serve?</b> The other team scores, and your <b>partner serves next</b>.</li><li><b>Both of you lost a serve?</b> Now the serve goes to the other team (a “side out”), and they get two servers too.</li><li><b>Start of the game:</b> the first team to serve gets only <b>one</b> server, so the very first call is “0–0–2”.</li></ol>`)
  +sec('The two-bounce rule',`<p>After the serve, the ball has to <b>bounce once on each side</b> before anyone hits it out of the air.</p><p class="muted">So: serve → it bounces → they return it → it bounces → now anything goes.</p>`)
  +sec('The kitchen',`<p>The <b>kitchen</b> is the 7-foot zone on each side of the net. You <b>can't volley</b> (hit the ball out of the air) while standing in it or on its line.</p><p class="muted">You can step in to hit a ball that has bounced. Just step back out after.</p>`)
  +sec('You lose the rally if…',`<ul class="howlist"><li>The ball lands out of bounds or goes into the net.</li><li>It bounces twice on your side.</li><li>You volley while in the kitchen.</li><li>You hit it out of the air before the two bounces are done.</li></ul><p class="muted" style="margin:8px 0 0">Ball on the line? It's <b>in</b>. The one exception: a serve that lands on the kitchen line is out.</p>`)
  +sec('Beginner tips',`<ul class="howlist"><li><b>Paddle up</b> in front of you, ready to block.</li><li><b>Soft beats hard.</b> Gentle shots that land in the kitchen (“dinks”) are hard to attack.</li><li>After your return, <b>walk up to the kitchen line</b> together with your partner.</li><li>Ball down the middle? <b>Call “mine!”</b> so you don't both swing.</li><li>Not sure if it was in? Give the point to the other team. Keep it friendly.</li></ul>`)
  +sec('Etiquette',`<ul class="howlist"><li>Tap paddles at the net after every game.</li><li>Call lines on your own side only.</li><li>Ball rolls onto another court? Yell “ball!” and wait for them to stop.</li></ul>`);
}

const VIEWS={chat:vChat,setup:vSetup,players:vPlayers,play:vPlay,board:vBoard,register:vRegister,mine:vMine,live:vLive,rules:vRules};
function allowedTabs(){
  if(isAdmin)return S.event.chatOn?ADMIN_TABS:ADMIN_TABS.filter(t=>t!=='chat');
  const c=S.event.chatOn?['chat']:[];
  if(!S.event.published)return ['register',...c,'rules'];
  const t=['register'];
  if(user&&myReg)t.push('mine');
  t.push('live',...c,'board','rules');
  return t;
}
function vAcct(){
  if(!BE)return '';
  if(!cloud())return '<span class="badge">Local mode</span>';
  if(!user)return `<button class="hbtn" data-action="signin">Sign in</button>`;
  return `<div class="who">${esc(user.displayName||user.email)}${isAdmin?'<br><span class="badge">Admin</span>':''}</div><button class="hbtn" data-action="signout">Sign out</button>`;
}
function render(){
  const tabs=allowedTabs();
  if(!tabs.includes(tab))tab=tabs[0];
  updateHeader();
  $('#acct').innerHTML=vAcct();
  document.body.classList.toggle('player',!isAdmin);
  renderNav(tabs);
  $('#main').innerHTML=ready?VIEWS[tab]():'<div class="card empty">Loading…</div>';
  $('#footer').innerHTML=isAdmin?(cloud()?'Saved online. Only you can edit. Players see Event, My games, Courts, Chat, Ranks and Rules.':'Local mode: everything saves on this device.'):'Courts and scores update live.';
}
function renderNav(tabs){
  tabs=tabs||allowedTabs();
  const u=unread(),badge=k=>k==='chat'&&u?`<i class="nbadge">${u>9?'9+':u}</i>`:'';
  const navHtml=isAdmin?tabs.map(k=>(k==='register'?'<span class="sep"></span>':'')+`<button data-tab="${k}" class="${k===tab?'on':''}">${k==='register'?'Sign-up page':TAB_LABELS[k]}${badge(k)}</button>`).join(''):'';
  if($('#nav').dataset.sig!==navHtml){$('#nav').innerHTML=navHtml;$('#nav').dataset.sig=navHtml}
  $('#nav').hidden=!isAdmin;
  const bn=$('#bnav');
  if(!isAdmin&&tabs.length>1){bn.hidden=false;bn.innerHTML=tabs.map(k=>`<button data-tab="${k}" class="${k===tab?'on':''}" ${k===tab?'aria-current="page"':''}><span class="ico"><svg ${ICON_ATTR}>${ICONS[k]||''}</svg>${badge(k)}</span><span>${BN_LABELS[k]||TAB_LABELS[k]}</span></button>`).join('')}
  else{bn.hidden=true;bn.innerHTML=''}
}
function focusKey(el){if(!el||!el.dataset)return null;for(const k of ['score','bind','prize','pname','pgroup','form'])if(el.dataset[k]!=null)return `[data-${k}="${CSS.escape(el.dataset[k])}"]`;if(el.id)return '#'+CSS.escape(el.id);return null}
function renderKeep(){
  const a=document.activeElement,k=focusKey(a);let s=null,e=null;try{s=a.selectionStart;e=a.selectionEnd}catch(x){}
  const open=[...document.querySelectorAll('details.past[open] summary b')].map(b=>b.textContent);
  render();
  document.querySelectorAll('details.past').forEach(d=>{if(open.includes(d.querySelector('summary b').textContent))d.open=true});
  if(k){const el=document.querySelector(k);if(el){el.focus({preventScroll:true});try{if(s!=null)el.setSelectionRange(s,e)}catch(x){}}}
}
function go(t){tab=t;try{localStorage.setItem(KEY+':tab',t)}catch(e){}render();if(t==='chat'){markSeen();renderNav();chatBottom()}else window.scrollTo({top:0});const b=$('#nav').querySelector(`[data-tab="${t}"]`);if(b)b.scrollIntoView({inline:'center',block:'nearest'})}

/* ---------- events ---------- */
async function doSignIn(){try{await BE.signIn()}catch(e){console.error(e);toast('Sign-in failed: '+(e.code||e.message))}}
document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');if(tb){go(tb.dataset.tab);return}
  const a=e.target.closest('[data-action]');if(!a)return;
  const id=a.dataset.id,act=a.dataset.action;
  switch(act){
    case 'signin':doSignIn();return;
    case 'signout':try{await BE.signOut()}catch(err){}return;
    case 'chatDel':{if(!confirm('Delete this message?'))return;try{await BE.deleteChat(S.chatEpoch,id)}catch(err){toast('Could not delete that message')}return}
    case 'editReg':ui.editing=true;ui.form=null;render();return;
    case 'cancelEdit':ui.editing=false;ui.form=null;render();return;
    case 'cancelReg':if(!confirm('Cancel your registration?'))return;try{await BE.deleteMyReg(user.uid);Promise.resolve(BE.setMyBringing(user.uid,{item:''})).catch(()=>{});ui.form=null;toast('Registration cancelled')}catch(err){toast('Could not cancel: '+(err.code||err.message))}return;
    case 'copyLink':{const link=location.origin+location.pathname;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(()=>toast('Site link copied'),()=>prompt('Copy this link:',link));else prompt('Copy this link:',link);return}
  }
  if(!isAdmin)return;
  switch(act){
    case 'addPlayers':{const t=$('#bulk').value;if(!t.trim()){toast('Type some names first');return}ui.bulk='';addPlayers(t);break}
    case 'sample':addPlayers(SAMPLE.join('\n'));break;
    case 'delPlayer':{const p=P(id);if(S.rounds.some(r=>r.games.some(g=>g.a.concat(g.b).includes(id)))&&!confirm(`Remove ${p.name}? Their past games stay on the record. To just stop scheduling them, untick Playing instead.`))return;S.players=S.players.filter(x=>x.id!==id);save();break}
    case 'delReg':{const r=regs.find(x=>x.id===id);if(!confirm(`Remove ${r?r.name:'this'} registration? They can register again while sign-ups are open.`))return;try{await BE.deleteReg(id);Promise.resolve(BE.deleteBringing(id)).catch(()=>{})}catch(err){toast('Could not remove: '+(err.code||err.message))}return}
    case 'newRound':{const r=lastRound();if(r&&!roundDone(r)&&!confirm('This round is missing scores. Start the next round anyway?'))return;if(newRound(false))toast(`Round ${lastRound().n} is set`);break}
    case 'champRound':{const r=lastRound();if(r&&!roundDone(r)&&!confirm('This round is missing scores. Start the championship anyway?'))return;if(!confirm('Start the championship? The top 4 play #1 & #4 vs #2 & #3. Everyone else plays one more game.'))return;if(newRound(true))toast('Championship game is set');break}
    case 'reshuffle':{const r=lastRound();if(!r)return;S.rounds.pop();if(!newRound(!!r.final))S.rounds.push(r);else toast('Reshuffled');break}
    case 'delRound':{const r=lastRound();if(!r)return;if(!confirm(`Delete ${r.final?'the championship round':'round '+r.n}${r.games.some(g=>g.sa!=null||g.sb!=null)?' and its scores':''}?`))return;S.rounds.pop();ui.swap=null;save(true);break}
    case 'swapPick':swapPick(a.dataset.pos);break;
    case 'swapCancel':ui.swap=null;break;
    case 'export':{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=(S.event.name||'pickleball').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-backup.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
    case 'import':$('#importFile').click();return;
    case 'resetRounds':if(confirm('Clear every round and score? Players and settings stay.')){S.rounds=[];ui.swap=null;save(true)}break;
    case 'clearChat':{if(!confirm('Clear the chat for everyone?'))return;const old=S.chatEpoch;S.chatEpoch=uid();save(true);ensureChat();Promise.resolve(BE.clearChat(old)).catch(()=>{});toast('Chat cleared');break}
    case 'chatOnBtn':S.event.chatOn=true;save(true);ensureChat();break;
    case 'reset':if(confirm('Erase all players, rounds, scores, chat and settings? Online registrations stay and will be added back.')){const oldChat=S.chatEpoch;S=blank();S.chatEpoch=uid();Promise.resolve(BE.clearChat(oldChat)).catch(()=>{});syncRegs();save(true)}break;
  }
  render();
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.form!=null&&ui.form){ui.form[el.dataset.form]=el.value}
  if(el.id==='bulk')ui.bulk=el.value;
  if(el.id==='chatInput'){chat.draft=el.value;el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px'}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='chatInput'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&window.matchMedia('(hover:hover)').matches){e.preventDefault();sendChat()}
});
document.addEventListener('submit',async e=>{
  if(e.target.matches('[data-chat-form]')){e.preventDefault();sendChat();return}
  if(!e.target.matches('[data-form-root]'))return;
  e.preventDefault();
  if(!user||!ui.form)return;
  const f=ui.form;const name=String(f.name||'').trim(),partner=String(f.partner||'').trim();
  if(!name){toast('Please enter your name');return}
  const kids=Math.max(0,Math.min(10,parseInt(f.kids,10)||0));
  ui.busy=true;render();
  const data={name:name.slice(0,40),partner:partner.slice(0,40),kids,note:String(f.note||'').trim().slice(0,200)};
  try{
    await BE.saveMyReg(user.uid,data,!myReg);
    // Potluck sign-ups are gone (pizza is provided): clear any old "bringing" entry.
    Promise.resolve(BE.setMyBringing(user.uid,{item:''})).catch(()=>{});
    ui.editing=false;ui.form=null;toast(myReg?'Changes saved':'You’re registered!');
  }
  catch(err){console.error(err);toast(err&&err.code==='permission-denied'?'Registration is closed':'Could not register: '+(err.code||err.message))}
  ui.busy=false;render();
});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(!isAdmin)return;
  if(d.score!=null){setScore(d.score,el.value);setTimeout(renderKeep,0);return}
  if(d.bind!=null){
    const k=d.bind;
    if(el.type==='date'||el.type==='time'){
      if(el.type==='date'&&el.value&&!(Number(el.value.slice(0,4))>=2000))return;
      S.event[k]=el.value;save();updateHeader();return;
    }
    S.event[k]=el.type==='checkbox'?el.checked:(el.type==='number'?(el.value===''?'':Number(el.value)):el.value);
    save(k==='regOpen'||k==='published'||k==='chatOn');
    if(k==='chatOn')ensureChat();
    if(el.type==='checkbox'||el.type==='number')renderKeep();else updateHeader();
    return;
  }
  if(d.prize!=null){S.event.prizes[d.prize]=el.value;save();return}
  if(d.here!=null){const p=P(d.here);if(p)p.out=!el.checked;save();render();return}
  if(d.pname!=null){const p=P(d.pname);if(p)p.name=el.value.trim()||p.name;save();render();return}
  if(d.pgroup!=null){const p=P(d.pgroup);if(p)p.group=el.value.trim();save();return}
});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Replace everything with this backup?'))return;S=normalize(d);syncRegs();save(true);render();toast('Backup loaded')}catch(err){toast('That file is not a valid backup')}};
  r.readAsText(f);e.target.value='';
});

/* ---------- backends ---------- */
function localBackend(){
  return {mode:'local',
    init(cb){cb({uid:'local',email:'',displayName:'Organizer'})},
    async signIn(){},async signOut(){},
    async checkAdmin(){return true},
    watchState(cb){let r=null;try{r=localStorage.getItem(KEY)}catch(e){}cb(r);return()=>{}},
    async saveState(json){try{localStorage.setItem(KEY,json)}catch(e){}},
    watchMyReg(){return()=>{}},async saveMyReg(){},async deleteMyReg(){},
    watchRegs(cb){cb([]);return()=>{}},async deleteReg(){},
    watchBringing(cb){cb(null);return()=>{}},async setMyBringing(){},async deleteBringing(){},
    _chatCbs:[],
    _chatGet(ep){try{return JSON.parse(localStorage.getItem(KEY+':chat:'+ep))||[]}catch(e){return []}},
    _chatPut(ep,l){try{localStorage.setItem(KEY+':chat:'+ep,JSON.stringify(l))}catch(e){}this._chatCbs.forEach(c=>c.ep===ep&&c.cb(l.slice()))},
    watchChat(ep,cb){const o={ep,cb};this._chatCbs.push(o);setTimeout(()=>cb(this._chatGet(ep)),0);return()=>{this._chatCbs=this._chatCbs.filter(x=>x!==o)}},
    async sendChat(ep,m){const l=this._chatGet(ep);l.push({id:uid(),...m,at:Date.now()});this._chatPut(ep,l)},
    async deleteChat(ep,id){this._chatPut(ep,this._chatGet(ep).filter(x=>x.id!==id))},
    async clearChat(ep){try{localStorage.removeItem(KEY+':chat:'+ep)}catch(e){}}
  };
}
async function firebaseBackend(cfg){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [App,A,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=App.initializeApp(cfg),auth=A.getAuth(app),db=F.getFirestore(app);
  const stateRef=F.doc(db,'public','state');
  const provider=new A.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
  return {mode:'cloud',
    init(cb){A.getRedirectResult(auth).catch(e=>console.error(e));A.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid,email:u.email,displayName:u.displayName}:null))},
    async signIn(){
      try{await A.signInWithPopup(auth,provider)}
      catch(e){
        if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code))return A.signInWithRedirect(auth,provider);
        if(['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code))return;
        throw e;
      }
    },
    signOut(){return A.signOut(auth)},
    async checkAdmin(){try{await F.getDoc(F.doc(db,'admin','check'));return true}catch(e){return false}},
    watchState(cb){return F.onSnapshot(stateRef,s=>cb(s.exists()?s.data().json:null),e=>{console.error(e);toast('Could not load the event')})},
    saveState(json,m){m=m||{};return F.setDoc(stateRef,{json,regOpen:!!m.regOpen,chatOn:!!m.chatOn,chatEpoch:String(m.chatEpoch||'main'),updatedAt:F.serverTimestamp()})},
    watchMyReg(id,cb){return F.onSnapshot(F.doc(db,'registrations',id),s=>cb(s.exists()?s.data():null),()=>cb(null))},
    saveMyReg(id,data,isNew){
      const extra=isNew?{paid:false,createdAt:F.serverTimestamp()}:{};
      return F.setDoc(F.doc(db,'registrations',id),{...data,uid:id,email:auth.currentUser.email,updatedAt:F.serverTimestamp(),...extra},{merge:true});
    },
    deleteMyReg(id){return F.deleteDoc(F.doc(db,'registrations',id))},
    watchRegs(cb){return F.onSnapshot(F.collection(db,'registrations'),qs=>cb(qs.docs.map(d=>({id:d.id,...d.data()}))),e=>console.error(e))},
    deleteReg(id){return F.deleteDoc(F.doc(db,'registrations',id))},
    watchBringing(cb){return F.onSnapshot(F.collection(db,'bringing'),qs=>cb(qs.docs.map(d=>({uid:d.id,name:d.data().name,item:d.data().item}))),()=>cb(null))},
    setMyBringing(id,b){const ref=F.doc(db,'bringing',id);return b.item?F.setDoc(ref,{name:String(b.name||'').slice(0,90),item:String(b.item).slice(0,100),updatedAt:F.serverTimestamp()}):F.deleteDoc(ref)},
    deleteBringing(id){return F.deleteDoc(F.doc(db,'bringing',id))},
    watchChat(ep,cb,err){const q=F.query(F.collection(db,'chats',ep,'messages'),F.orderBy('at'),F.limitToLast(300));return F.onSnapshot(q,qs=>cb(qs.docs.map(d=>{const v=d.data({serverTimestamps:'estimate'});return {id:d.id,uid:v.uid,name:v.name,text:v.text,host:!!v.host,at:v.at&&v.at.toMillis?v.at.toMillis():Date.now()}})),err)},
    sendChat(ep,m){return F.addDoc(F.collection(db,'chats',ep,'messages'),{uid:m.uid,name:m.name,text:m.text,host:!!m.host,at:F.serverTimestamp()})},
    deleteChat(ep,id){return F.deleteDoc(F.doc(db,'chats',ep,'messages',id))},
    async clearChat(ep){const qs=await F.getDocs(F.collection(db,'chats',ep,'messages'));await Promise.all(qs.docs.map(d=>F.deleteDoc(d.ref)))}
  };
}

window.__tourney={state:()=>JSON.parse(JSON.stringify(S))};

/* ---------- boot ---------- */
async function onAuth(u){
  user=u;
  isAdmin=BE.mode==='local'?true:(u?await BE.checkAdmin(u):false);
  if(unRegs){unRegs();unRegs=null}if(unMy){unMy();unMy=null}
  regs=[];myReg=null;ui.form=null;ui.editing=false;
  if(cloud()&&u){
    unMy=BE.watchMyReg(u.uid,r=>{myReg=r;renderKeep()});
    if(isAdmin)unRegs=BE.watchRegs(r=>{regs=r;if(ready&&syncRegs())save();renderKeep()});
  }
  if(isAdmin&&cloud()&&ready&&stateMissing){stateMissing=false;save(true)}
  if(isAdmin&&cloud()&&ready&&!metaSynced){metaSynced=true;save(true)}
  ensureChat();
  if(!allowedTabs().includes(tab))tab=allowedTabs()[0];
  render();
}
(async()=>{
  if(window.__BACKEND__)BE=window.__BACKEND__;
  else{
    let cfg=null;
    try{cfg=(await import('./firebase-config.js')).firebaseConfig}catch(e){}
    if(cfg&&cfg.apiKey&&!/PASTE|YOUR_/i.test(cfg.apiKey)){
      try{BE=await firebaseBackend(cfg)}catch(e){console.error(e);toast('Could not load Google sign-in. Check your connection.')}
    }
    if(!BE)BE=localBackend();
  }
  if(!tab)tab=BE.mode==='local'?'setup':'register';
  BE.watchState(onState);
  if(BE.watchBringing)BE.watchBringing(list=>{liveBring=list;if(ready)renderKeep()});
  BE.init(onAuth);
})();
